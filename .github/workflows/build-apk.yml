name: Build family trial APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: family-trial-release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Configure fixed APK signing
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEYSTORE_BASE64" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "::error::Fixed signing secrets are missing. Configure SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, and SIGNING_KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/littlecompanion-fixed.jks"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "SIGNING_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          echo "Fixed signing certificate fingerprints (bind SHA1 in Amap Console):"
          keytool -list -v -keystore "$keystore_path" -alias "$SIGNING_KEY_ALIAS" -storepass "$SIGNING_STORE_PASSWORD" | grep -E 'SHA1:|SHA256:' || true
      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $sdk_root"
          sdk_manager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$sdk_manager" ]; then
            echo 'Android SDK command-line tools were not found.'
            exit 1
          fi
          "$sdk_manager" 'platforms;android-35' 'build-tools;35.0.0'
          echo "sdk.dir=$sdk_root" > local.properties
      - name: Build debug APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug
      - name: Prepare family trial package
        run: cp app/build/outputs/apk/debug/app-debug.apk elder-voice-assistant.apk
      - uses: actions/upload-artifact@v4
        with:
          name: elder-voice-assistant-apk
          path: elder-voice-assistant.apk
      - name: Publish downloadable APK
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = `trial-${process.env.GITHUB_RUN_NUMBER}-${process.env.GITHUB_RUN_ATTEMPT}`;
            const release = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `家庭试用版 ${tag}`,
              body: '自动构建的调试版APK，尚未进行真机验收。请勿用于无人陪同导航或依赖识图付款。'
            });
            await github.rest.repos.uploadReleaseAsset({
              ...context.repo,
              release_id: release.data.id,
              name: 'elder-voice-assistant.apk',
              data: fs.readFileSync('elder-voice-assistant.apk')
            });
