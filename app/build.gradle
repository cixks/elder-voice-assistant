plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.family.littlecompanion'
    compileSdk 35

    defaultConfig {
        applicationId 'cn.family.littlecompanion'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.4.1'
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    signingConfigs {
        fixed {
            def storePath = System.getenv('SIGNING_KEYSTORE_PATH') ?: findProperty('SIGNING_KEYSTORE_PATH')
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv('SIGNING_STORE_PASSWORD') ?: findProperty('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS') ?: findProperty('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD') ?: findProperty('SIGNING_KEY_PASSWORD')
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            if (signingConfigs.fixed.storeFile != null) {
                signingConfig signingConfigs.fixed
            }
        }
        release {
            minifyEnabled false
            if (signingConfigs.fixed.storeFile != null) {
                signingConfig signingConfigs.fixed
            }
        }
    }
}

dependencies {
    implementation 'com.amap.api:navi-3dmap-location-search:latest.integration'
}
